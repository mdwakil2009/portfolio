<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" />
  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Ambient Glow -->
  <circle cx="400" cy="220" r="180" fill="#38bdf8" opacity="0.12" filter="blur(50px)"/>
  <circle cx="600" cy="300" r="160" fill="#6366f1" opacity="0.1" filter="blur(60px)"/>

  <!-- App Window Container -->
  <g transform="translate(60, 50)">
    <rect width="680" height="400" rx="16" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Bar -->
    <rect width="680" height="44" rx="16" fill="#1e293b" />
    <rect y="30" width="680" height="14" fill="#1e293b" />
    <line x1="0" y1="44" x2="680" y2="44" stroke="#334155" stroke-width="1" />
    
    <!-- Window Controls -->
    <circle cx="25" cy="22" r="6" fill="#ef4444" />
    <circle cx="45" cy="22" r="6" fill="#f59e0b" />
    <circle cx="65" cy="22" r="6" fill="#10b981" />
    <text x="340" y="27" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">devstack.app — Tech Stack Explorer</text>

    <!-- Main Window Content -->
    <!-- App Header inside UI -->
    <g transform="translate(40, 75)">
      <rect width="44" height="44" rx="10" fill="url(#primaryGlow)" />
      <!-- Logo Symbol (Layers) -->
      <path d="M22 14 L34 20 L22 26 L10 20 Z" fill="#ffffff" opacity="0.95"/>
      <path d="M10 24 L22 30 L34 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M10 28 L22 34 L34 28" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      
      <text x="60" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">DevStack</text>
      <text x="60" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Interactive Technology Stack Builder &amp; Manager</text>
    </g>

    <!-- Tech Grid Showcase -->
    <g transform="translate(40, 145)">
      <!-- Card 1: React -->
      <g transform="translate(0, 0)">
        <rect width="186" height="95" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
        <text x="18" y="32" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="600">⚛ React.js</text>
        <text x="18" y="54" fill="#94a3b8" font-family="sans-serif" font-size="11">Frontend Library</text>
        <rect x="18" y="66" width="60" height="18" rx="9" fill="#0369a1" fill-opacity="0.3"/>
        <text x="48" y="79" fill="#7dd3fc" font-family="sans-serif" font-size="9" text-anchor="middle">Selected</text>
      </g>

      <!-- Card 2: TypeScript -->
      <g transform="translate(206, 0)">
        <rect width="186" height="95" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
        <text x="18" y="32" fill="#60a5fa" font-family="sans-serif" font-size="14" font-weight="600">TS TypeScript</text>
        <text x="18" y="54" fill="#94a3b8" font-family="sans-serif" font-size="11">Static Typing</text>
        <rect x="18" y="66" width="60" height="18" rx="9" fill="#1e3a8a" fill-opacity="0.3"/>
        <text x="48" y="79" fill="#93c5fd" font-family="sans-serif" font-size="9" text-anchor="middle">Selected</text>
      </g>

      <!-- Card 3: Tailwind CSS -->
      <g transform="translate(412, 0)">
        <rect width="186" height="95" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4"/>
        <text x="18" y="32" fill="#22d3ee" font-family="sans-serif" font-size="14" font-weight="600">🎨 Tailwind CSS</text>
        <text x="18" y="54" fill="#94a3b8" font-family="sans-serif" font-size="11">Utility-First CSS</text>
        <rect x="18" y="66" width="60" height="18" rx="9" fill="#155e75" fill-opacity="0.3"/>
        <text x="48" y="79" fill="#67e8f9" font-family="sans-serif" font-size="9" text-anchor="middle">Selected</text>
      </g>

      <!-- Bottom Status Row -->
      <g transform="translate(0, 115)">
        <rect width="600" height="48" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
        <circle cx="24" cy="24" r="6" fill="#10b981"/>
        <text x="38" y="28" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="500">Active Stack: 5 Core Tools Selected</text>
        <rect x="475" y="12" width="110" height="24" rx="6" fill="url(#primaryGlow)"/>
        <text x="530" y="28" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Export Stack →</text>
      </g>
    </g>
  </g>
</svg>
